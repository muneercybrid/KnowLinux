name: Release Companion Agent

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: bun-linux-x64-baseline
            output: linux-x64
          - target: bun-linux-arm64
            output: linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build binary
        run: |
          cd companion
          bun build ./index.ts --compile --target=${{ matrix.target }} --outfile knowlinux-${{ matrix.output }}

      - name: Verify binary
        run: |
          ls -lh companion/knowlinux-${{ matrix.output }}
          file companion/knowlinux-${{ matrix.output }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: companion/knowlinux-${{ matrix.output }}
          draft: false
          prerelease: false
